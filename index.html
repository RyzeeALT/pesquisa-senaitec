<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/style.css">
    <title>Pesquisa SenaiTec</title>
</head>
<body>
    <main> 
        <header>
            <img src="./img/logo.png" alt="Logo SenaiTec" width="200px" height="200px">
            <h1>Pesquisa SenaiTec</h1>
        </header>
            <section>
        <form action="index.html" method="get">
            <fieldset>
                <legend>Dados Pessoais</legend>
                
            <label for="userName">Nome</label>
            <input type="text" name="userName" id="userName">

            <br>
            <label for="UserAge">Idade:</label>
            <input type="number" name="UserAge" id="UserAge">

            <br>
            <label for="userBirthDate">Data de Nascimento:</label>
            <input type="date" name="userBirthDate" id="userBirthDate">

            <br>
            <label for="userEmail">E-mail:</label>
            <input type="email" name="userEmail" id="userEmail">

            <br>
            <label for="userPhone">Telefone:</label>
            <input type="tel" name="userPhone" id="userPhone" pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}" placeholder="Ex: 11-99999-9999">

            <br>
            <label for="file">Foto:</label>
            <input type="file" name="file" id="file">


            </fieldset>




            <fieldset>
                <legend>Perfil</legend>
                    <p>Gênero:</p>
                    <br>
                    <input type="radio" name="userGender" id="userGenderMale" value="male">
                    <label for="userGenderMale">Masculino</label>
                    <br>
                    <input type="radio" name="userGender" id="userGenderFemale" value="female">
                    <label for="userGenderFemale">Feminino</label>
                    <br>
                    <input type="radio" name="userGender" id="userGenderNone" value="none">
                    <label for="userGenderNone">Prefiro não informar</label>


                    <br>
                    <label for="userMaritalStatus">Estado Civil:</label>
                    <select name="userMaritalStatus" id="userMaritalStatus">
                        <option value="">Selecione...</option>
                        <option value="single">Solteiro(a)</option>
                        <option value="married">Casado(a)</option>
                        <option value="divorced">Divorciado(a)</option>
                        <option value="widowed">Viúvo(a)</option>
                    </select>

                    <br>
                    <label for="userState">Estado(UF):</label>
                    <select name="userState" id="userState" list="states">
                        <option value="">Selecione...</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>
                    
                    <br>
                    <label for="userCity">Cidade:</label>
                    <input type="text" name="userCity" id="userCity" placeholder="Digite sua cidade">
                </fieldset>
                
                
                <fieldset> 
                    <legend>Hábitos</legend>
                    <label for="userSocialMedia1">Instagram</label>
                    <input type="checkbox" name="userSocialMedia1" id="userSocialMedia1">

                    <br>
                    <label for="userSocialMedia2">Facebook</label>
                    <input type="checkbox" name="userSocialMedia2" id="userSocialMedia2">

                    <br>
                    <label for="userSocialMedia3">Twitter</label>
                    <input type="checkbox" name="userSocialMedia3" id="userSocialMedia3">

                    <br>
                    <label for="userSocialMedia4">TikTok</label>
                    <input type="checkbox" name="userSocialMedia4" id="userSocialMedia4">

                    <br>
                    <label for="userMusicStyle">Estilo Musical:</label>
                    <input list="userMusicStyles" name="userMusicStyle" id="userMusicStyle">
                    <datalist id="userMusicStyles">
                        <option value="Rock Alternativo">
                        <option value="Blues">
                        <option value="Música Clássica">
                        <option value="Pop">
                        <option value="Funk">
                        <option value="MPB">
                        <option value="Samba">
                        <option value="Sertanejo">
                    </datalist>

                    <br>
                    <label for="userFavoriteColor">Cor Favorita:</label>
                    <input type="color" name="userFavoriteColor" id="userFavoriteColor" value="#ff0000">

            </fieldset>
            
            <fieldset> 
                <legend>Satisfação</legend>
                    <label for="userOpinion">Nível de satisfação com o SenaiTec:</label>
                    <input type="range" name="userOpinion" id="userOpinion" min="0" max="5" step="1">

                    <br>
                    <label for="userFeedback">Comentário Aberto:</label>
                    <textarea name="userFeedback" id="userFeedback"></textarea>
                </fieldset>
            


                <fieldset> 
                    <legend>Confirmações</legend>
                    <label for="userTerms">Consentimento obrigatório (LGPD):</label>
                    <br>
                    <input type="checkbox" name="userTerms" id="userTerms" value="accepted">
                    <label for="userTerms">Li e concordo com os termos de uso e política de privacidade.</label>
                
                    <br>
                    <label for="userNewsletter">Deseja receber resultados:</label>
                    <br>
                    <input type="checkbox" name="userNewsletter" id="userNewsletter" value="accepted">
                    <label for="userNewsletter">Sim</label>
                </fieldset>




            <br>
            <button type="submit">Enviar e limpar</button>
            

        </form>
            </section>
    </main>
</body>
</html>
